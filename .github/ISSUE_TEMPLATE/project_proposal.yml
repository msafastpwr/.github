name: 🚀 Open Source Project Proposal
description: Propose a new software tool, web application, or repository under msafastpwr
title: "[PROJECT]: "
labels: ["project-proposal", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an open-source initiative under **Microsoft Student Ambassadors — FAST-NUCES Peshawar**!
        All project proposals are reviewed by the Technical Team and Executive Council during the weekly sprint sync as governed by [`PROJECT_LIFECYCLE.md`](../PROJECT_LIFECYCLE.md).
  - type: input
    id: project_name
    attributes:
      label: Project Name & Working Title
      placeholder: "e.g., FAST Course Scheduler / Lab Seat Reservation Portal"
    validations:
      required: true
  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: What specific challenge, workflow, or pain point does this project address for FAST students or the developer community?
      placeholder: "Describe the current problem and why existing alternatives are insufficient..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Key Features
      description: Detail the functional scope and key features of the application.
      placeholder: "- Feature 1: Dynamic timetable clash detector\n- Feature 2: PDF schedule exporter\n- Feature 3: Cloud sync with Microsoft account"
    validations:
      required: true
  - type: dropdown
    id: tech_stack
    attributes:
      label: Primary Tech Stack
      description: Which technologies and cloud services will power this project?
      options:
        - "Vanilla Web (HTML5 / Modern CSS / ES6+ JS) + GitHub Pages"
        - "Next.js / React / TypeScript + Azure Static Web Apps"
        - "Python (FastAPI / Flask) + Azure App Service"
        - "Node.js (Express / TypeScript) + Azure Functions"
        - "Other / Multi-Service Architecture"
    validations:
      required: true
  - type: input
    id: lead_maintainer
    attributes:
      label: Proposed Project Lead & Maintainers
      description: GitHub usernames of student leads committed to maintaining this codebase.
      placeholder: "@username1, @username2"
    validations:
      required: true
  - type: checkboxes
    id: governance_checks
    attributes:
      label: Governance & Engineering Commitments
      options:
        - label: "I have read and agree to adhere to the Project Lifecycle standards in PROJECT_LIFECYCLE.md."
          required: true
        - label: "I understand this project will be licensed under the MIT Open Source License."
          required: true
        - label: "I commit to maintaining active documentation, responsive UI, and peer code reviews."
          required: true
