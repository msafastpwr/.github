name: 🐛 Bug Report
description: Report a bug, broken link, or unexpected behavior in our website or repository
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much relevant information as possible so our technical team can reproduce and resolve it.
  - type: input
    id: affected_component
    attributes:
      label: Affected Component or Repository
      description: Which site page, tool, script, or repository is experiencing this issue?
      placeholder: "e.g., msafastpwr.github.io (Events page), Email Studio script, etc."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Explain what happened...
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this behavior?
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Device Details
      description: Operating system, browser, version, or viewport size (if applicable).
      value: |
        - OS: [e.g., Windows 11, macOS, Ubuntu, Android, iOS]
        - Browser: [e.g., Chrome, Edge, Firefox, Safari]
        - Device: [e.g., Desktop, Mobile, Tablet]
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have verified that this issue has not already been reported.
          required: true
        - label: I have confirmed that no sensitive personal data or secrets are included in this report.
          required: true
